<!doctype html><html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a"><title>Thu thập thông tin ứng viên V4.2</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#0f172a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#0f172a,#172554 55%,#1e3a8a);padding:18px 10px}
.card{max-width:850px;margin:auto;background:#fff;border-radius:22px;box-shadow:0 18px 60px rgba(0,0,0,.28);overflow:hidden}
.header{padding:25px 18px 18px;text-align:center;border-bottom:1px solid #e5e7eb}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#dbeafe;color:#1d4ed8;font-size:11px;font-weight:800}
h1{font-size:24px;margin:10px 0 5px}.sub{margin:0;color:#64748b;font-size:13px}.form{padding:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:14px}label{display:block;font-size:13px;font-weight:750;margin-bottom:6px;color:#334155}
.req{color:#e11d48}input,select{width:100%;height:46px;border:1px solid #cbd5e1;border-radius:11px;padding:0 12px;font-size:15px;background:#fff;color:#0f172a;outline:none}
input:focus,select:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}input.invalid,select.invalid{border-color:#dc2626;box-shadow:0 0 0 3px rgba(220,38,38,.08)}
.hint{font-size:11px;color:#64748b;margin-top:4px}.hidden{display:none!important}
.actions{display:flex;gap:10px;margin-top:7px;padding-top:17px;border-top:1px solid #e5e7eb}
button{height:48px;border:0;border-radius:11px;padding:0 18px;font-size:14px;font-weight:800;cursor:pointer}.primary{flex:1;background:#2563eb;color:#fff}.primary:disabled{opacity:.6;cursor:not-allowed}.secondary{background:#e2e8f0;color:#334155}
.status{display:none;margin-top:14px;padding:13px 14px;border-radius:11px;font-size:13px;font-weight:650}.status.ok{display:block;background:#dcfce7;color:#166534}.status.err{display:block;background:#fee2e2;color:#991b1b}.status.wait{display:block;background:#dbeafe;color:#1e40af}
.spinner{display:inline-block;width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;vertical-align:-2px;animation:spin .7s linear infinite;margin-right:6px}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:680px){.grid{grid-template-columns:1fr}.actions{flex-direction:column}body{padding:8px}.form{padding:15px}h1{font-size:20px}}
</style></head><body><main class="card">
<header class="header"><span class="badge">V4.2 • GOOGLE SHEETS</span><h1>PHIẾU THU THẬP THÔNG TIN ỨNG VIÊN</h1><p class="sub">CCCD là khóa dữ liệu. Kiểm tra kỹ trước khi gửi.</p></header>
<form id="candidateForm" class="form" novalidate>
<div class="grid">
<div class="field"><label>Số CCCD <span class="req">*</span></label><input id="soCCCD" inputmode="numeric" maxlength="12" autocomplete="off" required placeholder="12 chữ số"><div class="hint">Bắt buộc đúng 12 chữ số và không được trùng.</div></div>
<div class="field"><label>Họ và Tên <span class="req">*</span></label><input id="hoTen" required autocomplete="name" placeholder="Ví dụ: Nguyễn Văn An"></div>
</div>
<div class="grid">
<div class="field"><label>Số Điện Thoại <span class="req">*</span></label><input id="soDienThoai" inputmode="numeric" maxlength="10" required placeholder="10 chữ số"></div>
<div class="field"><label>Số Điện Thoại Người Thân <span class="req">*</span></label><input id="soDienThoaiNguoiThan" inputmode="numeric" maxlength="10" required placeholder="10 chữ số"></div>
</div>
<div class="field"><label>Tỉnh/Thành Phố <span class="req">*</span></label><select id="tinhThanh" required onchange="updateXaPhuong()"><option value="">-- Chọn Tỉnh/Thành Phố --</option><option value="An Giang">An Giang</option><option value="Bắc Ninh">Bắc Ninh</option><option value="Cà Mau">Cà Mau</option><option value="Cao Bằng">Cao Bằng</option><option value="Đắk Lắk">Đắk Lắk</option><option value="Điện Biên">Điện Biên</option><option value="Đồng Nai">Đồng Nai</option><option value="Đồng Tháp">Đồng Tháp</option><option value="Gia Lai">Gia Lai</option><option value="Hà Tĩnh">Hà Tĩnh</option><option value="Hưng Yên">Hưng Yên</option><option value="Khánh Hòa">Khánh Hòa</option><option value="Lai Châu">Lai Châu</option><option value="Lâm Đồng">Lâm Đồng</option><option value="Lạng Sơn">Lạng Sơn</option><option value="Lào Cai">Lào Cai</option><option value="Nghệ An">Nghệ An</option><option value="Ninh Bình">Ninh Bình</option><option value="Phú Thọ">Phú Thọ</option><option value="Quảng Ngãi">Quảng Ngãi</option><option value="Quảng Ninh">Quảng Ninh</option><option value="Quảng Trị">Quảng Trị</option><option value="Sơn La">Sơn La</option><option value="Tây Ninh">Tây Ninh</option><option value="Thái Nguyên">Thái Nguyên</option><option value="Thanh Hóa">Thanh Hóa</option><option value="TP. Cần Thơ">TP. Cần Thơ</option><option value="TP. Đà Nẵng">TP. Đà Nẵng</option><option value="TP. Hà Nội">TP. Hà Nội</option><option value="TP. Hải Phòng">TP. Hải Phòng</option><option value="TP. Hồ Chí Minh">TP. Hồ Chí Minh</option><option value="TP. Huế">TP. Huế</option><option value="Tuyên Quang">Tuyên Quang</option><option value="Vĩnh Long">Vĩnh Long</option></select></div>
<div class="grid">
<div class="field">
<label>Xã/Phường/Đặc Khu <span class="req">*</span></label>
<select id="xaPhuong" required disabled>
<option value="">-- Trước tiên chọn Tỉnh/Thành Phố --</option>
</select>
<div class="hint">Danh sách xã/phường/đặc khu lấy từ file 3.321 đơn vị hành chính bạn cung cấp.</div>
</div>
<div class="field"><label>Thôn/Tổ Dân Phố <span class="req">*</span></label><input id="thonToDanPho" required placeholder="Nhập Thôn/Tổ Dân Phố"></div>
</div>
<div class="grid">
<div class="field"><label>Trình Độ Học Vấn <span class="req">*</span></label><select id="trinhDo" required><option value="">-- Chọn trình độ --</option><option value="Tiểu Học">Tiểu Học</option><option value="THCS">THCS</option><option value="THPT">THPT</option><option value="Trung Cấp">Trung Cấp</option><option value="Cao Đẳng">Cao Đẳng</option><option value="Đại Học">Đại Học</option><option value="Trên Đại Học">Trên Đại Học</option></select></div>
<div class="field"><label>Tên Trường</label><input id="tenTruong" placeholder="Tên trường tốt nghiệp cao nhất"></div>
</div>
<div class="grid">
<div class="field"><label>Mã Số BHXH</label><input id="maBHXH" inputmode="numeric" maxlength="10" placeholder="Không bắt buộc"><div class="hint">Nếu có: đúng 10 chữ số.</div></div>
<div class="field"><label>Kênh Tuyển Dụng <span class="req">*</span></label><select id="kenhTuyenDung" required><option value="">-- Chọn kênh --</option><option value="Tự ứng tuyển">Tự ứng tuyển</option><option value="Giới thiệu nội bộ">Giới thiệu nội bộ</option><option value="ZM">ZM</option><option value="WEVN">WEVN</option><option value="SUCCESS">SUCCESS</option><option value="GTV (việc ba miền)">GTV (việc ba miền)</option><option value="VT (Việt thông)">VT (Việt thông)</option><option value="Khác">Khác</option></select><input id="kenhKhac" class="hidden" style="margin-top:8px" placeholder="Nhập kênh tuyển dụng khác"></div>
</div>
<div class="field"><label>Công Ty Làm Gần Nhất <span class="req">*</span></label><select id="congTyGanNhat" required><option value="">-- Chọn công ty --</option><option value="Foxconn - Fii">Foxconn - Fii</option><option value="Foxconn - Fukang">Foxconn - Fukang</option><option value="Newwing - Fit">Newwing - Fit</option><option value="Fushan">Fushan</option><option value="Goertek">Goertek</option><option value="Luxshare">Luxshare</option><option value="Biel">Biel</option><option value="Crystal Martin">Crystal Martin</option><option value="Siflex">Siflex</option><option value="Cannon">Cannon</option><option value="Samkwang">Samkwang</option><option value="Samsung">Samsung</option><option value="Việc tự do">Việc tự do</option><option value="Nội trợ">Nội trợ</option><option value="Làm nông">Làm nông</option><option value="Khác">Khác</option></select><input id="congTyKhac" class="hidden" style="margin-top:8px" placeholder="Nhập tên công ty khác"></div>
<div id="status" class="status" role="alert" aria-live="polite"></div>
<div class="actions"><button class="primary" id="submitBtn" type="submit">GỬI THÔNG TIN</button><button class="secondary" type="reset">XÓA NHẬP LẠI</button></div>
</form></main>
<script>
const $=id=>document.getElementById(id);
const norm=s=>(s||"").replace(/\s+/g," ").trim();
const digits=s=>(s||"").replace(/\D/g,"");
const titleVI=s=>norm(s).toLocaleLowerCase("vi-VN").replace(/(^|\s|[-/])([\p{L}])/gu,(_,a,b)=>a+b.toLocaleUpperCase("vi-VN"));
const valid=(s,n)=>new RegExp("^\\d{"+n+"}$").test(s);

["soCCCD","soDienThoai","soDienThoaiNguoiThan","maBHXH"].forEach(id=>$(id).addEventListener("input",e=>{e.target.value=digits(e.target.value);e.target.classList.remove("invalid")}));
["hoTen","thonToDanPho","tenTruong","kenhKhac","congTyKhac"].forEach(id=>$(id).addEventListener("blur",e=>e.target.value=titleVI(e.target.value)));


/* ===== DANH MỤC 3.321 XÃ/PHƯỜNG/ĐẶC KHU ===== */
const ADMIN_DATA = %s;

function cleanProvinceName(s){
  return String(s || "")
    .normalize("NFC")
    .replace(/\s+/g, " ")
    .trim()
    .replace(/^(TP\.?|Tỉnh|Thành phố)\s*/i, "")
    .trim()
    .toLocaleLowerCase("vi-VN");
}

const PROVINCE_INDEX = {};
Object.keys(ADMIN_DATA).forEach(function(key){
  PROVINCE_INDEX[cleanProvinceName(key)] = key;
});

function findProvinceKey(selected){
  const target = cleanProvinceName(selected);
  if (PROVINCE_INDEX[target]) return PROVINCE_INDEX[target];

  return Object.keys(ADMIN_DATA).find(function(key){
    const k = cleanProvinceName(key);
    return k === target || k.includes(target) || target.includes(k);
  }) || null;
}

/* Hàm này được gọi trực tiếp từ onchange của ô Tỉnh/Thành Phố */
function updateXaPhuong(){
  const provinceSelect = document.getElementById("tinhThanh");
  const wardSelect = document.getElementById("xaPhuong");
  if(!provinceSelect || !wardSelect) return;

  const province = provinceSelect.value;
  wardSelect.innerHTML = "";

  if(!province){
    wardSelect.disabled = true;
    const opt = document.createElement("option");
    opt.value = "";
    opt.textContent = "-- Trước tiên chọn Tỉnh/Thành Phố --";
    wardSelect.appendChild(opt);
    return;
  }

  const key = findProvinceKey(province);
  const wards = key ? ADMIN_DATA[key] : [];

  if(!wards.length){
    wardSelect.disabled = true;
    const opt = document.createElement("option");
    opt.value = "";
    opt.textContent = "-- Không tìm thấy danh sách xã/phường --";
    wardSelect.appendChild(opt);
    return;
  }

  wardSelect.disabled = false;

  const first = document.createElement("option");
  first.value = "";
  first.textContent = "-- Chọn Xã/Phường/Đặc Khu --";
  wardSelect.appendChild(first);

  wards.forEach(function(ward){
    const opt = document.createElement("option");
    opt.value = ward;
    opt.textContent = ward;
    wardSelect.appendChild(opt);
  });
}

/* Bao phủ cả trường hợp trình duyệt tự khôi phục giá trị biểu mẫu */
document.addEventListener("DOMContentLoaded", function(){
  updateXaPhuong();
  setTimeout(updateXaPhuong, 100);
  setTimeout(updateXaPhuong, 500);
});

window.addEventListener("pageshow", function(){
  setTimeout(updateXaPhuong, 100);
});

$("kenhTuyenDung").addEventListener("change",()=>{const x=$("kenhTuyenDung").value==="Khác";$("kenhKhac").classList.toggle("hidden",!x);if(!x)$("kenhKhac").value=""});
$("congTyGanNhat").addEventListener("change",()=>{const x=$("congTyGanNhat").value==="Khác";$("congTyKhac").classList.toggle("hidden",!x);if(!x)$("congTyKhac").value=""});

function show(msg,type){const e=$("status");e.innerHTML=msg;e.className="status "+type}
function clearInvalid(){document.querySelectorAll(".invalid").forEach(e=>e.classList.remove("invalid"))}
function bad(id,msg){$(id).classList.add("invalid");show(msg,"err");$(id).focus();return false}

$("candidateForm").addEventListener("reset",()=>setTimeout(()=>{clearInvalid();$("kenhKhac").classList.add("hidden");$("congTyKhac").classList.add("hidden");$("status").className="status";$("status").textContent=""},0));

$("candidateForm").addEventListener("submit",e=>{
e.preventDefault();clearInvalid();
const cccd=digits($("soCCCD").value),phone=digits($("soDienThoai").value),rel=digits($("soDienThoaiNguoiThan").value),bhxh=digits($("maBHXH").value);
if(!valid(cccd,12))return bad("soCCCD","Số CCCD phải đúng 12 chữ số.");
if(!norm($("hoTen").value))return bad("hoTen","Vui lòng nhập Họ và Tên.");
if(!valid(phone,10))return bad("soDienThoai","Số Điện Thoại phải đúng 10 chữ số.");
if(!valid(rel,10))return bad("soDienThoaiNguoiThan","Số Điện Thoại Người Thân phải đúng 10 chữ số.");
if(!$("tinhThanh").value)return bad("tinhThanh","Vui lòng chọn Tỉnh/Thành Phố.");
if(!norm($("xaPhuong").value))return bad("xaPhuong","Vui lòng nhập Xã/Phường/Đặc Khu.");
if(!norm($("thonToDanPho").value))return bad("thonToDanPho","Vui lòng nhập Thôn/Tổ Dân Phố.");
if(!$("trinhDo").value)return bad("trinhDo","Vui lòng chọn Trình Độ Học Vấn.");
if(bhxh&&!valid(bhxh,10))return bad("maBHXH","Mã Số BHXH nếu nhập phải đúng 10 chữ số.");
const channel=$("kenhTuyenDung").value==="Khác"?norm($("kenhKhac").value):$("kenhTuyenDung").value;
const company=$("congTyGanNhat").value==="Khác"?norm($("congTyKhac").value):$("congTyGanNhat").value;
if(!channel)return bad("kenhKhac","Vui lòng nhập Kênh Tuyển Dụng khác.");
if(!company)return bad("congTyKhac","Vui lòng nhập Công Ty Làm Gần Nhất khác.");

const payload={"Số CCCD":cccd,"Họ và Tên":titleVI($("hoTen").value),"Số Điện Thoại":phone,"Số Điện Thoại Người Thân":rel,"Tỉnh/Thành Phố":$("tinhThanh").value,"Xã/Phường/Đặc Khu":titleVI($("xaPhuong").value),"Thôn/Tổ Dân Phố":titleVI($("thonToDanPho").value),"Trình Độ Học Vấn":$("trinhDo").value,"Tên Trường":titleVI($("tenTruong").value),"Mã Số BHXH":bhxh,"Kênh Tuyển Dụng":channel,"Công Ty Làm Gần Nhất":company};
const btn=$("submitBtn");btn.disabled=true;btn.innerHTML='<span class="spinner"></span>ĐANG LƯU...';show("Đang kiểm tra CCCD và ghi dữ liệu vào Google Sheets...","wait");
fetch("/api/save-candidate",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify(payload)
}).then(async response=>{
  let res=null;
  try{res=await response.json()}catch(_){}
  btn.disabled=false;
  btn.textContent="GỬI THÔNG TIN";
  if(response.ok && res && res.ok){
    show("✅ "+res.message+"<br>CCCD: "+res.cccd+"<br>Thời gian nhập: "+(res.timestamp||""),"ok");
    e.target.reset();
  }else{
    show("❌ "+((res&&res.error)||"Không thể lưu dữ liệu. Vui lòng thử lại."),"err");
  }
}).catch(err=>{
  btn.disabled=false;
  btn.textContent="GỬI THÔNG TIN";
  show("❌ Không kết nối được máy chủ. Vui lòng kiểm tra Internet và thử lại.","err");
});
</script></body></html>
